<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سريع PDF - تحويل الصور مجاناً</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --p: #007bff; --s: #28a745; --bg: #f8f9fa; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; text-align: center; }
        .nav { background: white; padding: 20px; shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { background: white; max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn { background: var(--s); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .upload { border: 2px dashed #ccc; padding: 30px; margin-bottom: 20px; cursor: pointer; }
        .info { max-width: 600px; margin: 20px auto; text-align: right; padding: 20px; background: white; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="nav"><h1>سريع PDF 📄</h1></div>
    <div class="card">
        <h2>حوّل صورك إلى PDF الآن</h2>
        <div class="upload" onclick="document.getElementById('imgInp').click()">اضغط هنا لاختيار صورة</div>
        <input type="file" id="imgInp" accept="image/*" style="display:none">
        <button class="btn" onclick="convert()">تحميل الملف بصيغة PDF</button>
    </div>
    <div class="info">
        <h3>لماذا تستخدم موقعنا؟</h3>
        <ul>
            <li>مجاني تماماً وسريع جداً.</li>
            <li>نحافظ على خصوصيتك، التحويل يتم في جهازك فقط.</li>
            <li>متوافق مع جميع الهواتف وأجهزة الكمبيوتر.</li>
        </ul>
    </div>
    <script>
        async function convert() {
            const { jsPDF } = window.jspdf;
            const inp = document.getElementById('imgInp');
            if (inp.files.length === 0) return alert("اختر صورة أولاً");
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const pdf = new jsPDF();
                    const w = pdf.internal.pageSize.getWidth();
                    const h = pdf.internal.pageSize.getHeight();
                    const ratio = Math.min(w / img.width, h / img.height);
                    pdf.addImage(img, 'JPEG', (w - img.width * ratio) / 2, (h - img.height * ratio) / 2, img.width * ratio, img.height * ratio);
                    pdf.save("my-document.pdf");
                }
            }
            reader.readAsDataURL(inp.files[0]);
        }
    </script>
</body>
</html>
